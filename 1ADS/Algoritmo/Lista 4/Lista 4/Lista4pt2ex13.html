<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<span>Informe saldo da conta</span>
<input type="text" id="input_saldo"/> <br>
<span>Informe débito</span>
<input type="text"id="input_debito"> <br>
<button onclick="analisar()">Analisar saldo</button>
<div id="div_exibir"></div>

</body>
</html>
<script>
    function analisar() {
        let ns = Number(input_saldo.value)
        let nd = Number(input_debito.value)
        let saldo = (ns - nd)

        if(saldo >= 0) {
            div_exibir.innerHTML = `<i style="color: blue;">O saldo atual da conta corrente é ${saldo}</i>`
        }
        else {
            div_exibir.innerHTML = `<b style="color: red;">O saldo atual da conta corrente é ${saldo}</b>`
        }
    }
</script>
