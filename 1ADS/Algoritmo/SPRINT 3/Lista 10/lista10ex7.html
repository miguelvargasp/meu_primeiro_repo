<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cadastro de Jogos com Conversão de Texto</h2>
    Informe o nome do jogo: <br>
    <input type="text" id="ipt_nome"> <br>
    Informe a empresa: <br>
    <input type="text" id="ipt_empresa"> <br>
    Informe a plataforma: <br>
    <input type="text" id="ipt_plataforma"> <br>
    <button onclick="cadastrar()">Cadastrar jogo</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function cadastrar(){
        let jogo = {
            nome : ipt_nome.value,
            empresa : ipt_empresa.value,
            plataforma : ipt_plataforma.value
        }

        jogo.nome = jogo.nome.toUpperCase()
        jogo.empresa = jogo.empresa.toLowerCase()
        let mensagem = '';

        mensagem = `Jogo: ${jogo.nome} <br>
                Empresa: ${jogo.empresa} <br>
                Plataforma: ${jogo.plataforma}`

        div_mensagem.innerHTML = mensagem

    }
</script>
