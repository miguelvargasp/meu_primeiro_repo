<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cadastro de Usuários do Sistema</h2>
    Informe o nome: <br>
    <input type="text" id="ipt_nome"> <br>
    Informe a idade: <br>
    <input type="text" id="ipt_idade"> <br>
    Informe o cargo: <br>
    <input type="text" id="ipt_cargo"> <br>
    <button onclick="cadastrar()">Cadastrar Usuário</button>
    <button onclick="exibir()">Exibir Usuários</button>
    <div id="div_mensagem"></div>
    <div id="div_lista"></div>
</body>
</html>
<script>
    let listaUsuarios = [];

    function cadastrar(){
        let usuario = {
            nome : ipt_nome.value,
            idade : Number(ipt_idade.value),
            cargo : ipt_cargo.value
        }

        if (usuario.cargo == "Administrador") {
            usuario.acesso = "Total"
        } else {
            usuario.acesso = "Limitado"
        }

        listaUsuarios.push(usuario);

        let mensagem = '';

        mensagem = `Usuário: ${usuario.nome} <br>
                Cargo: ${usuario.cargo} <br>
                Nível de acesso: ${usuario.acesso}`

        div_mensagem.innerHTML = mensagem
    }

    function exibir(){
        let mensagem = '';

        for(let i = 0; i < listaUsuarios.length; i++){
            let usuarioAtual = listaUsuarios[i];
            mensagem += `${i+1}. Usuário: ${usuarioAtual.nome} | Idade: ${usuarioAtual.idade} | Cargo: ${usuarioAtual.cargo} | Nível de acesso: ${usuarioAtual.acesso}<br>`
        }

        div_lista.innerHTML = mensagem
    }
</script>
