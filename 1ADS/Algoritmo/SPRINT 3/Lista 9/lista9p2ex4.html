<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>
<body>

    <h2>Cadastro de Alunos com Exibição Invertida</h2>

    Nome do aluno: <input type="text" id="ipt_aluno">
    <button onclick="cadastrar()">Cadastrar</button>

    <div id="div_mensagem"></div>

</body>
</html>

<script>
    let alunos = [];

    function cadastrar() {
        let aluno = ipt_aluno.value
        alunos.push(aluno   );
        let mensagem = '';
        for (let i = alunos.length - 1; i >= 0; i--) {
            mensagem += `${alunos[i]} <br>`;
        }
        div_mensagem.innerHTML = mensagem;
    }
</script>
