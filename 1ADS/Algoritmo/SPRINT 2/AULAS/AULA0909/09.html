<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Idade:
    <input type="text" id="input_idade"> <br>
    Possui título?
    <select id="select_titulo">
        <option>Sim</option>
        <option>Não</option>
    </select>

    <button onclick="verificar()">Verificar Voto</button>
    <div id="div_mensagem"></div>
</body>
</html>
<script>
    function verificar(){
        let idade = input_idade.value
        let titulo = select_titulo.value

        // idade = 17   SEMPRE FARÁ A RELACIONAL PRIMEIRO
        // titulo = 'Sim' 
        if(idade >= 16 && titulo =='Sim'){
            div_mensagem.innerHTML = `Você já pode votar`
        } else{ // VALIDA idade < 18 || titulo != 'Sim'
            div_mensagem.innerHTML = `Você <b>NÃO</b> pode votar`
        }
    }
</script>
