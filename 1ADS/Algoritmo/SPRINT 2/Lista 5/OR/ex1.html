<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Juliane Joada e Suas Frutas Preferidas</h2>
    <span>Qual a fruta que chegou na mesa?</span> <br>
    <label for="input_fruta"></label>
    <input type="text" id="input_fruta"> <br>
    <button onclick="comer()">Vai comer?</button>

</body>
</html>
<script>
    function comer(){
        let fruta = input_fruta.value

        if(fruta == 'abacaxi' || fruta == 'uva'){
            alert(`Sim, vai comer ${fruta}`)
        } else{
            alert(`A fruta ${fruta} ela não come`)
        }
    }
</script>
