<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Validação de Notas: Seu Resultado é Aceitável?</h2>
    <span>Qual é a sua nota real?</span> <br>
    <label for="input_nota"></label>
    <input type="text" id="input_nota"> <br>
    <button onclick="avaliar()">Avaliar Notaa</button>
    <div id="div_exibir"></div>


</body>
</html>
<script>
    function avaliar(){
        let nota = Number(input_nota.value)

        if(nota >= 0 && nota <= 10){
            div_exibir.innerHTML = `Nota válida`
        } else{
            alert(`Onde já se viu nota menor que 0 e maior que 10?!`)
        }
    }
</script>
