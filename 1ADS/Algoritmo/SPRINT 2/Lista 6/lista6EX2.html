<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Detector de Palavras</h2>
    Digite uma frase: <br>
    <label for="input_frase"></label>
    <input type="text" id="input_frase"> <br>
    <button onclick="analisar()">Analisar Frase</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function analisar(){
        let frase = input_frase.value
        let invalida = frase.includes('teste') || frase.includes('abc') || frase.includes('spam') 

        if(invalida){
            div_exibir.innerHTML = `Frase inválida`
        } else{
            div_exibir.innerHTML = `Frase válida`
        } 
    }
</script>
