<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>S2 Pares</h2>
    <button onclick="filtrar()">S2 Pares</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    
    function filtrar(){
        let contador = 0;
        while(contador < 100){
            

            if(contador % 2 == 0){
            div_exibir.innerHTML += `${contador} <br>`
        }
        contador++;
        }
    }
</script>
