<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Frase Numerada</h2>
    <input type="text" id="ipt_frase"> <br>
    <button onclick="dizer()">Diga algo sobre a matéria de Algoritmos</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    function dizer(){
        let frase = ipt_frase.value;
        let contador = 1;
        while(contador <= 7 && frase == 'Boa tarde'){
            div_exibir.innerHTML += `${contador}. ${frase} <br>`
            contador ++;
        }
    }
</script>
