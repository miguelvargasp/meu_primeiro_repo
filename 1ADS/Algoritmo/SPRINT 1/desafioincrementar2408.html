<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="incrementrar()">Incrementar</button>
    <div id ="div_mensagem"></div>
</body>
</html>
<script>
    let contador = 0
  
    function incrementrar() {
        // contador = contador + 1
        contador += 1
        div_mensagem.innerHTML += `O numero ${contador} <br>`
    }  

</script>
