<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Contagem Simples</h2>
    <button onclick="contar()">Contar</button>
    <div id="div_mensagem"></div>

</body>
</html>
<script>
    function contar(){
        let contador = 0;
        while(contador <= 15){
            div_mensagem.innerHTML += `${contador} <br>` 
            contador++;
        }
    }
</script>
