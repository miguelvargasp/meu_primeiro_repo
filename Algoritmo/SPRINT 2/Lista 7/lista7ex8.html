<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Múltiplos de 5</h2>
    Informe um numero entre 20 e 100:
    <input type="text" id="ipt_numero">
    <button onclick="filtrar()">Adoro múltiplos de 5</button>
    <div id="div_exibir"></div>
</body>
</html>
<script>
    
    function filtrar(){
        let contador = Number(ipt_numero.value);
        let mensagem = ''
        while(contador >= 20 && contador <= 100){
            

            if(contador % 5 == 0){
            mensagem += `${contador} <br>`
        }
        contador++;
        
        }
        div_exibir.innerHTML = mensagem
    }
</script>
