<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Comparador de Palavras</h2>

    Informe duas palavras: <br>
    <label for="input_pala1"></label>
    <input type="text" id="input_pala1"> <br>
    <label for="input_pala2"></label>
    <input type="text" id="input_pala2"> <br>

    <button onclick="analisar()">Analisar palavras</button>
    <div id="div_exibir"></div>

</body>
</html>
<script>
    function analisar(){
        let palavra1 = input_pala1.value
        let palavra2 = input_pala2.value 
        let meioigual = palavra1.toUpperCase() == palavra2.toUpperCase()
        
        if(palavra1 == palavra2){
            div_exibir.innerHTML = `As palavras ${palavra1} e ${palavra2} são exatamente iguais!`
        } else if(meioigual){
            div_exibir.innerHTML = `As palavras ${palavra1} e ${palavra2} possuem o mesmo conteúdo, mas a digitação é diferente (maiúsculas e minúsculas)`
        } else{
            div_exibir.innerHTML = `As palavras ${palavra1} e ${palavra2} são completamente diferentes!`
        }

    }
</script>
