<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="contar()">Contar</button>
  </body>
</html>
<script>
  function contar() {
    let contador = 0; // inicia o contador em 0

    while (contador <= 5) {
      alert(`Contador: ${contador}`); // exibe o valor antes de incrementar;
      contador++;
      console.log(`Contador: ${contador}`); // exibe o valor incrementado
    }

    console.log("Finalizado"); // sempre aparece, ao final das repetições
  }
</script>
