<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="valorp" />
    <input type="text" id="qtamigos" />
    <button onclick="calcular()">Calcular</button>
    <div id="div_exibir"></div>

</body>
</html>
<script>
    function calcular() {
        let n1 = Number(valorp.value)
        let n2 = Number(qtamigos.value)
        let resultado = n1 / n2
        let mensagem = `Cada um dos ${n2} amigos deve pagar: ${resultado}`

        div_exibir.innerHTML = mensagem
    }

</script>
