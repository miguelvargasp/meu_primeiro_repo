<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Valor a ser depositado ou retirado:</span>
    <input type="text" id="depret_valor" /> 
    <br>
    <button onclick="depositar()">Depositar</button>
    <button onclick="retirar()">Retirar</button>
    <div id="div_contador"></div>
</body>
</html>
<script>
    let contador = 0;
  
    function depositar() {
       let valor = Number(depret_valor.value);
        contador += valor
        div_contador.innerHTML = `Depósito de R$${contador.toFixed(2)} efetuado! Saldo: ${contador.toFixed(2)}`
    }
    
    function retirar() {
        let valor = Number(depret_valor.value);
        contador -= valor 
        div_contador.innerHTML = `Retirada de R$${contador.toFixed(2)} efetuada! Saldo: ${contador.toFixed(2)}`
    }

</script>
