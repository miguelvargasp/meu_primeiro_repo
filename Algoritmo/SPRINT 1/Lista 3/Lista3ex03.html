<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="valorp" />
    <input type="text" id="qtviagens" />
    <button onclick="calcular()">Ver economia</button>
    <div id="div_exibir"></div>

</body>
</html>
<script>
    function calcular() {
        let n1 = Number(valorp.value)
        let n2 = Number(qtviagens.value)
        let resultado = (n1 * n2)/2
        let mensagem = `Você economizará ${resultado} por mês`

        div_exibir.innerHTML = mensagem
    }
</script>
