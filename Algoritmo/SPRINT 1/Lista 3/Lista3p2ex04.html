<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<span>Digite suas notas continuada e semestral, respectivamente:</span>
<input type="text" id="input_nota1" />
<input type="text" id="input_nota2" />
<br>
<span>Digite seu nome:</span>
<input type="text" id="input_nome" />
<button onclick="calcular()">Calcular média</button>
<div id="div_exibir"></div>

</body>
</html>
<script>
    function calcular() {
        let nc = Number(input_nota1.value)
        let ns = Number(input_nota2.value)
        let nome = input_nome.value
        let media = (nc * 0.4 + ns * 0.6)
        let mensagem = `A média de ${nome} será de: ${media}`
        div_exibir.innerHTML = mensagem
    }
        
</script>
