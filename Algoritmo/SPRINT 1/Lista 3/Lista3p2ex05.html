<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<span>Quantas você horas dormiu?</span>    
<input type="text" id="horas_sono"/>
<button onclick="calcular()"> Calcular sono</button>
<div id="div_exibir"></div>

</body>
</html>
<script>
    function calcular() {
        let ns = Number(horas_sono.value)
        let n1 = ns * 0.05
        let n2 = ns * 0.45
        let n3 = ns * 0.3
        let nr = ns * 0.2     
        let mensagem = `Ao dormir ${ns} horas você dormiu: <br>
        ${n1} horas na fase 1 <br> 
        ${n2} horas na fase 2 <br>
        ${n3} horas na fase 3 <br>
        ${nr} horas na fase REM`

        div_exibir.innerHTML = mensagem
    }


</script>
