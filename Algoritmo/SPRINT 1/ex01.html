<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Cidade natal:</span>
    <input id="input_cidade" type="text">
    
<br>
    <span>Ano de nascimento:</span>
    <input id="input_ano" type="number">
    
    <button onclick="cadastrar()">Cadastrar</button>

</body>

<script> 
    function cadastrar() { 
        alert('Você nasceu na cidade de ' + input_cidade.value + ' em ' + input_ano.value) }
</script>
