<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<span>Informe quantidade de homens no elevador:</span>
<input type="text" id="qtd_homem"/><br>
<span>Informe quantidade de mulheres no elevador:</span>
<input type="text" id="qtd_mulher"/><br>
<button onclick="analisar()">Analisar peso</button>
<div id="div_analisar"></div>


</body>
</html>
<script>
    function analisar() {
        let nh = Number(qtd_homem.value)
        let nm = Number(qtd_mulher.value)
        let calculo = (nh * 90) + (nm * 70)

        if(calculo <= 500) {
            div_analisar.innerHTML = `<span style="color: green;">Elevador vai se mover, pois está com ${calculo}kg</span>`
        }
        else {
            div_analisar.innerHTML = `<span style="color: red;">Alguém precisa descer. Precisa perder ${calculo - 500}kg para mover o elevador </span>`
        }
    }
</script>
