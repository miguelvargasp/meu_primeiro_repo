<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <span>Cidade Natal: </span>
    <input placeholder="Digite sua cidade" type="text" id="input_cidade"> <br>

    <span>Ano de Nascimento: </span>
    <input placeholder="Ex: 2005" type="text" id="input_ano"> <br>
    
    <!-- placeholder representa uma "dica" para o usuário enquanto o campo estiver vazio -->

    <button onclick="cadastrar()">Cadastrar</button>
</body>
</html>
<script>
    function cadastrar() {
        alert('Você nasceu na cidade de ' + input_cidade.value + ' em ' + input_ano.value)
    }
</script>
