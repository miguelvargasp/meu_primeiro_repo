<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>Contador: <span id="span_cont">0</span></div>
    <button onclick="incrementar()">Incrementar</button>
    <button onclick="decrementar()">Decrementar</button>
</body>
</html>
<script>
    let contador = 0; // atribuição

    function incrementar() {
        contador = contador + 1; // reatribui
        span_cont.innerHTML = contador;
    }

    function decrementar() {
        contador = contador - 1;
        span_cont.innerHTML = contador;
    }
</script>

<!-- ====================================================================
     EXPLICAÇÃO DOS CONCEITOS APLICADOS
     ====================================================================

     1. MESMA LÓGICA DE CONTAGEM DE contador_v1.html
     - let contador = 0; global, e as mesmas reatribuições (contador = contador + 1 / - 1) dentro de incrementar() e decrementar().

     2. A TELA MUDOU: <div> com <span> DENTRO
     - Em vez de um único <div id="div_contagem">, agora o texto fixo "Contador: " fica direto no <div>, e só o número fica dentro de um <span id="span_cont">0</span>.
     - Isso separa o que é fixo (a palavra "Contador:") do que muda (o número).

     3. innerHTML = (SUBSTITUIR, NÃO ACRESCENTAR)
     - span_cont.innerHTML = contador; usa "=" (substitui todo o conteúdo do span pelo novo valor), diferente do "+=" usado em contador_v1.html.
     - Por isso a tela sempre mostra UM ÚNICO número atualizado, sem empilhar histórico de cliques anteriores.

     RESUMO:
     - Mesma lógica de incremento/decremento de contador_v1.html, mas trocando innerHTML += por innerHTML = e isolando o número num <span>.
     - Resultado prático: contador_v1.html mostra o HISTÓRICO de todos os valores; contador_v2.html mostra só o VALOR ATUAL, sempre substituído.
     ==================================================================== -->
